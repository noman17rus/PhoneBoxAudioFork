name: release
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Keep the verified release as a draft for review
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: fork-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/build.yml
  version:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python tools/check-release.py
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' agent/PhoneBox.Agent/PhoneBox.Agent.csproj | head -1)
          if git ls-remote --exit-code --tags origin "refs/tags/v$v"; then
            echo "::error::Tag already exists; increase the version"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
  apk:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Restore permanent fork signing key
        env:
          KEYSTORE: ${{ secrets.PHONEBOX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PHONEBOX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHONEBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHONEBOX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/fork.keystore"
      - name: Build signed APK
        working-directory: android
        env:
          PHONEBOX_STORE_FILE: ${{ runner.temp }}/fork.keystore
          PHONEBOX_STORE_PASSWORD: ${{ secrets.PHONEBOX_STORE_PASSWORD }}
          PHONEBOX_KEY_ALIAS: ${{ secrets.PHONEBOX_KEY_ALIAS }}
          PHONEBOX_KEY_PASSWORD: ${{ secrets.PHONEBOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew lintRelease assembleRelease --no-daemon --console=plain
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fork.keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fork-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
  agent:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Build self-contained Windows agent
        run: dotnet publish agent/PhoneBox.Agent -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -o out --nologo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fork-agent
          path: out/
          if-no-files-found: error
  publish:
    needs: [version, apk, agent]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fork-agent
          path: built-agent
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fork-signed-apk
          path: built-apk
      - name: Package all release files
        run: |
          python tools/package-fork.py --agent built-agent --apk built-apk/app-release.apk --out release-files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create draft for the exact checked commit
        run: |
          python tools/release-notes.py > notes.md
          gh release create "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PhoneBoxAudioFork $env:VERSION" --draft --notes-file notes.md (Get-ChildItem release-files -File).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Download and verify uploaded files
        run: |
          gh release download "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --dir downloaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/package-fork.py --verify --out downloaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive "downloaded/PhoneBoxAgent-$env:VERSION-win-x64.zip" downloaded-agent
          python tools/smoke-agent.py downloaded-agent/PhoneBoxAgent.exe --version $env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish verified release
        if: ${{ !inputs.draft }}
        run: |
          gh release edit "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
