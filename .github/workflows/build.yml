name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python3 tools/check-release.py
          python3 tools/test-winget-manifests.py

  android:
    name: Android panel (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle   # the Gradle distribution and dependencies, so a download hiccup does not fail the build
      - name: Check Android API compatibility and build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug assembleDebug --no-daemon --console=plain
      - name: Stream lifecycle regression checks (real Kotlin, gated completion)
        run: python3 tools/test-agent-stream.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phonebox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ui:
    name: UI tests (panel and settings in a browser)
    # Keep browser dependencies stable during the ubuntu-latest image migration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: tools/ui-tests
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run the tests against the web demo
        working-directory: tools/ui-tests
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-test-report
          path: |
            ui-test-report/
            tools/ui-tests/test-results/

  agent:
    name: Windows agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test agent/PhoneBox.Agent.Tests --nologo
      - name: Windows installer regression checks
        shell: pwsh
        run: |
          ./tools/test-install-apk.ps1
          ./tools/test-windows-source-publish.ps1
      - name: Publish self-contained agent
        run: dotnet publish agent/PhoneBox.Agent -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -o out --nologo
      - name: Smoke test
        shell: pwsh
        run: |
          $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content -Raw agent/PhoneBox.Agent/PhoneBox.Agent.csproj)).Groups[1].Value
          python tools/smoke-agent.py out/PhoneBoxAgent.exe --version $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phonebox-agent-win-x64
          path: out/
